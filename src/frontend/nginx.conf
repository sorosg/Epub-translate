# ============================================================
# EPUB Fordító – Frontend Nginx konfiguráció (SPA + API proxy)
#
# Ez a konfiguráció a React SPA konténerben fut.
# - A / útvonalon a React alkalmazást (dist/) szolgálja ki
# - SPA fallback: a mélylinkek (pl. /library, /reader/5) is
#   az index.html-re irányulnak, hogy a React Router kezelje
# - Az /api/ és /socket.io/ kéréseket a backend konténerre proxizza
# ============================================================

events { worker_connections 1024; }

http {
    # Betöltjük a MIME típus táblát – enélkül a .js fájlok
    # "text/plain"-ként kerülnek kiszolgálásra, és a böngésző
    # a JS modul betöltését a strict MIME ellenőrzés miatt elutasítja.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 200M;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    # Alap proxy headerek (a megfelelő X-Forwarded-* továbbításhoz)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Gzip tömörítés a statikus asset-ekhez
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge (SSL tanúsítványhoz)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        # Egészségügyi ellenőrzés
        location /health {
            return 200 "OK";
        }

        # WebSocket (Socket.IO valós idejű progress)
        location /socket.io/ {
            proxy_pass http://backend:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Backend API proxy
        location /api/ {
            proxy_pass http://backend:5000;
        }

        # Backend műveletek (a React SPA fetch-csel hívja őket).
        # FONTOS: a /login NEM szerepel itt, mert az a React SPA saját
        # útvonala (LoginPage) – ha ide proxyzzuk, a régi Jinja2 login oldal
        # jelenne meg helyette, és a böngésző elveszítené a SPA routingot.
        location /logout {
            proxy_pass http://backend:5000;
        }
        location /upload {
            proxy_pass http://backend:5000;
        }
        location /download {
            proxy_pass http://backend:5000;
        }
        location /delete {
            proxy_pass http://backend:5000;
        }

        # Statikus asset-ek (a Vite build hash-eléssel készül, ezért hosszú cache)
        location /assets/ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # React SPA – minden más útvonal az index.html-re irányul
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}