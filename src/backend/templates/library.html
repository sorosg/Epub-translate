{% extends "base.html" %}{% block title %}Könyvtár{% endblock %}{% block content %}
<h2><i class="bi bi-collection me-2"></i>Könyvtár</h2>

<!-- ═══════════════════════════════════════════════════════════════ -->
<!-- BATCH FELTÖLTŐ ZÓNA (több fájl drop, automatikus metaadat)      -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<div class="card mb-4" id="batchUploadCard">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5><i class="bi bi-cloud-upload me-2"></i>Könyvek feltöltése</h5>
    <span class="badge bg-info" id="batchProgress" style="display:none;">Feldolgozás...</span>
  </div>
  <div class="card-body">
    <!-- Drop zóna -->
    <div id="dropZone" style="border:2px dashed #555; border-radius:12px; padding:40px 20px; text-align:center; cursor:pointer; transition:all .3s; background:rgba(30,35,50,0.3);">
      <i class="bi bi-file-earmark-arrow-up" style="font-size:3rem; color:var(--accent-blue);"></i>
      <h5 class="mt-3 mb-2">Húzd ide az EPUB fájlokat</h5>
      <p class="text-secondary mb-0">vagy kattints a tallózáshoz · Több fájl is kiválasztható</p>
      <input type="file" id="fileInput" accept=".epub" style="display:none" multiple>
    </div>

    <!-- Batch feldolgozási lista -->
    <div id="batchList" class="mt-3" style="display:none;">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="mb-0"><i class="bi bi-list-ul me-1"></i>Feldolgozás alatt (<span id="batchCount">0</span> fájl)</h6>
        <div>
          <button class="btn btn-sm btn-outline-light me-2" onclick="autoFetchAll()"><i class="bi bi-search me-1"></i>Összes keresése</button>
          <button class="btn btn-sm btn-success" id="btnSaveAll" onclick="saveAllBooks()" disabled>
            <i class="bi bi-check-all me-1"></i>Összes mentése
          </button>
          <button class="btn btn-sm btn-outline-danger" onclick="clearBatch()"><i class="bi bi-x-lg me-1"></i>Mégse</button>
        </div>
      </div>
      <!-- Progress bar -->
      <div class="progress mb-3" style="height:6px;">
        <div class="progress-bar bg-gradient" id="batchProgressBar" style="width:0%; background:linear-gradient(90deg, var(--accent-blue), var(--accent-green));"></div>
      </div>
      <!-- Fájlok listája -->
      <div id="batchBookList" class="row g-2"></div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════ -->
<!-- SZŰRŐK                                                         -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<div class="card mb-3">
  <div class="card-body">
    <div class="row g-2">
      <div class="col-md-3"><input type="text" class="form-control form-control-sm" id="filterTitle" placeholder="Cím szűrés" oninput="renderBooks()"></div>
      <div class="col-md-2"><input type="text" class="form-control form-control-sm" id="filterAuthor" placeholder="Szerző szűrés" oninput="renderBooks()"></div>
      <div class="col-md-2">
        <select class="form-select form-select-sm" id="filterGenre" onchange="renderBooks()">
          <option value="">Minden műfaj</option><option value="sci-fi">Sci-Fi</option><option value="fantasy">Fantasy</option><option value="adventure">Kaland</option><option value="mystery">Krimi</option><option value="romance">Romantikus</option><option value="horror">Horror</option><option value="historical">Történelmi</option><option value="biography">Életrajz</option><option value="science">Tudományos</option><option value="other">Egyéb</option>
        </select>
      </div>
      <div class="col-md-2">
        <select class="form-select form-select-sm" id="filterLanguage" onchange="renderBooks()">
          <option value="">Minden nyelv</option><option value="en">Angol</option><option value="hu">Magyar</option><option value="de">Német</option><option value="fr">Francia</option><option value="es">Spanyol</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-sm btn-outline-info" onclick="loadBooks()"><i class="bi bi-arrow-repeat me-1"></i>Frissítés</button>
        <small class="text-muted ms-2">Összesen: <strong id="bookCount">0</strong> könyv</small>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════ -->
<!-- KÖNYVEK TÁBLÁZATA                                               -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<div class="card">
  <div class="card-body">
    <div id="booksTable"></div>
  </div>
</div>

<script>
// ============================
// ÁLLAPOT
// ============================
let allBooks = [];
let batchFiles = [];  // {file, metadata, status, error, filepath}

// ============================
// DROP ZÓNA ESEMÉNYEK
// ============================
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#0d6efd'; dropZone.style.background = 'rgba(13,110,253,0.08)'; });
dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#555'; dropZone.style.background = 'rgba(30,35,50,0.3)'; });
dropZone.addEventListener('drop', e => {
  e.preventDefault(); 
  dropZone.style.borderColor = '#555'; 
  dropZone.style.background = 'rgba(30,35,50,0.3)';
  if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length > 0) handleFiles(fileInput.files); });

// ============================
// FÁJLOK FELDOLGOZÁSA (BATCH)
// ============================
async function handleFiles(files) {
  const epubFiles = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.epub'));
  if (epubFiles.length === 0) { alert('Nincsenek EPUB fájlok a kiválasztottak között!'); return; }
  
  // Hozzáadjuk a batch listához
  for (const file of epubFiles) {
    // Duplikáció ellenőrzés a batch listán belül
    if (batchFiles.some(bf => bf.file.name === file.name && bf.file.size === file.size)) continue;
    
    batchFiles.push({
      file: file,
      metadata: { title: file.name.replace(/\.epub$/i,'').replace(/_/g,' '), author: '', language: 'en', description: '' },
      status: 'pending',  // pending, extracting, extracted, searching, ready, duplicate, error
      error: '',
      filepath: ''
    });
  }
  
  document.getElementById('batchList').style.display = 'block';
  document.getElementById('batchCount').textContent = batchFiles.length;
  document.getElementById('batchProgress').style.display = 'inline-block';
  
  renderBatchList();
  
  // Automatikus metaadat kinyerés minden fájlhoz
  await extractAllMetadata();
}

async function extractAllMetadata() {
  const total = batchFiles.length;
  for (let i = 0; i < batchFiles.length; i++) {
    const bf = batchFiles[i];
    if (bf.status !== 'pending') continue;
    
    bf.status = 'extracting';
    renderBatchList();
    updateProgress(i, total, 'Metaadat kinyerés...');
    
    try {
      // Fájl feltöltése a szerverre metaadat kinyeréshez
      const fd = new FormData();
      fd.append('file', bf.file);
      
      const resp = await fetch('/api/library/extract-metadata', {
        method: 'POST', credentials: 'same-origin', body: fd
      });
      const data = await resp.json();
      
      if (data.success && data.metadata) {
        bf.metadata = data.metadata;
        bf.status = 'extracted';
      } else {
        // Hiba esetén is van fallback metaadat (fájlnévből)
        if (data.metadata) bf.metadata = data.metadata;
        bf.status = 'extracted';
        bf.metadata._extractError = data.error || '';
      }
    } catch (e) {
      bf.status = 'error';
      bf.error = 'Metaadat kinyerés sikertelen: ' + e.message;
    }
    
    renderBatchList();
    updateProgress(i + 1, total, 'Kész: ' + (i+1) + '/' + total);
  }
  
  document.getElementById('batchProgress').style.display = 'none';
  updateButtons();
}

// ============================
// OPENLIBRARY KERESÉS (egy könyvhöz)
// ============================
async function fetchMetadataForBook(index) {
  const bf = batchFiles[index];
  if (!bf || bf.status === 'duplicate') return;
  
  const title = bf.metadata.title || '';
  const author = bf.metadata.author || '';
  const query = [title, author].filter(x => x).join(' ');
  if (query.length < 3) {
    bf.status = 'ready';
    renderBatchList();
    updateButtons();
    return;
  }
  
  bf.status = 'searching';
  renderBatchList();
  bf._searchResults = null;
  
  try {
    const resp = await fetch('/api/library/fetch-metadata', {
      method: 'POST', headers: {'Content-Type':'application/json'}, credentials:'same-origin',
      body: JSON.stringify({query: query})
    });
    const data = await resp.json();
    if (data.results && data.results.length > 0) {
      bf._searchResults = data.results;
      // Első találat automatikus kitöltése
      const r = data.results[0];
      if (r.title) bf.metadata.title = r.title;
      if (r.author) bf.metadata.author = r.author;
      if (r.language) {
        const lang = r.language.split(',')[0].trim().substring(0,2);
        bf.metadata.language = lang;
      }
      // Műfaj kitalálása
      if (r.subjects) {
        const genreMap = {'science fiction':'sci-fi','fantasy':'fantasy','adventure':'adventure','mystery':'mystery','romance':'romance','horror':'horror','historical':'historical','biography':'biography','science':'science'};
        for (let s of r.subjects) {
          for (let [k,v] of Object.entries(genreMap)) {
            if (s.toLowerCase().includes(k)) { bf.metadata.genre = v; break; }
          }
          if (bf.metadata.genre) break;
        }
      }
    }
    bf.status = 'ready';
  } catch (e) {
    bf.status = 'ready';
  }
  
  renderBatchList();
  updateButtons();
}

async function autoFetchAll() {
  document.getElementById('batchProgress').style.display = 'inline-block';
  const total = batchFiles.length;
  for (let i = 0; i < batchFiles.length; i++) {
    const bf = batchFiles[i];
    if (bf.status === 'duplicate' || bf.status === 'error') continue;
    updateProgress(i + 1, total, 'Keresés: ' + (i+1) + '/' + total);
    await fetchMetadataForBook(i);
  }
  document.getElementById('batchProgress').style.display = 'none';
}

// ============================
// SAVE ALL (batch feltöltés)
// ============================
async function saveAllBooks() {
  const ready = batchFiles.filter(bf => bf.status === 'ready' || bf.status === 'extracted');
  if (ready.length === 0) { alert('Nincsenek menthető könyvek!'); return; }
  
  document.getElementById('btnSaveAll').disabled = true;
  document.getElementById('batchProgress').style.display = 'inline-block';
  updateProgress(0, ready.length, 'Feltöltés...');
  
  // Először feltöltjük a fájlokat (egyenként, hogy legyen filepath)
  const booksToUpload = [];
  for (let i = 0; i < ready.length; i++) {
    const bf = ready[i];
    bf.status = 'uploading';
    renderBatchList();
    updateProgress(i + 1, ready.length, 'Feltöltés: ' + (i+1) + '/' + ready.length);
    
    try {
      // Fájl feltöltése - az extract végpont már nem menti el,
      // ezért az upload végpontot használjuk, de nem commit-oljuk
      // egyenként, hanem a batch-upload végpont fogja.
      // Először mentsük el a fájlt ideiglenesen
      const fd = new FormData();
      fd.append('file', bf.file);
      fd.append('title', bf.metadata.title);
      fd.append('author', bf.metadata.author);
      fd.append('language', bf.metadata.language || 'en');
      fd.append('genre', bf.metadata.genre || '');
      fd.append('series', bf.metadata.series || '');
      fd.append('series_number', bf.metadata.series_number || '');
      
      const resp = await fetch('/api/library/upload', {
        method: 'POST', credentials: 'same-origin', body: fd
      });
      const data = await resp.json();
      
      if (data.success) {
        bf.status = 'done';
        bf.uploadedId = data.id;
      } else if (data.duplicate) {
        bf.status = 'duplicate';
        bf.duplicateInfo = data;
      } else {
        bf.status = 'error';
        bf.error = data.error || 'Ismeretlen hiba';
      }
    } catch (e) {
      bf.status = 'error';
      bf.error = e.message;
    }
    
    renderBatchList();
  }
  
  // Statisztika
  const done = batchFiles.filter(bf => bf.status === 'done').length;
  const dups = batchFiles.filter(bf => bf.status === 'duplicate').length;
  const errs = batchFiles.filter(bf => bf.status === 'error').length;
  
  document.getElementById('batchProgress').style.display = 'none';
  alert('✅ Feltöltés kész!\n\n' +
    `Sikeres: ${done} könyv\n` +
    (dups > 0 ? `Duplikátum (kihagyva): ${dups}\n` : '') +
    (errs > 0 ? `Hiba: ${errs}` : ''));
  
  updateButtons();
  loadBooks();
}

// ============================
// SEGÉDFÜGGVÉNYEK
// ============================
function updateProgress(current, total, label) {
  const pct = total > 0 ? Math.round((current / total) * 100) : 0;
  document.getElementById('batchProgressBar').style.width = pct + '%';
  document.getElementById('batchProgress').textContent = label + ' (' + pct + '%)';
}

function updateButtons() {
  const ready = batchFiles.filter(bf => bf.status === 'ready' || bf.status === 'extracted').length;
  document.getElementById('btnSaveAll').disabled = (ready === 0);
}

function clearBatch() {
  batchFiles = [];
  document.getElementById('batchList').style.display = 'none';
  document.getElementById('batchBookList').innerHTML = '';
  document.getElementById('batchCount').textContent = '0';
  document.getElementById('batchProgressBar').style.width = '0%';
  document.getElementById('batchProgress').style.display = 'none';
  document.getElementById('btnSaveAll').disabled = true;
}

function renderBatchList() {
  let html = '';
  batchFiles.forEach((bf, i) => {
    const statusBadge = {
      'pending': '<span class="badge bg-secondary">Várakozik</span>',
      'extracting': '<span class="badge bg-info"><i class="bi bi-hourglass-split me-1"></i>Metaadat kinyerés...</span>',
      'extracted': '<span class="badge bg-info"><i class="bi bi-check me-1"></i>Kinyerve</span>',
      'searching': '<span class="badge bg-warning"><i class="bi bi-search me-1"></i>Keresés...</span>',
      'ready': '<span class="badge bg-success"><i class="bi bi-check-circle me-1"></i>Menthető</span>',
      'uploading': '<span class="badge bg-info"><i class="bi bi-cloud-upload me-1"></i>Feltöltés...</span>',
      'done': '<span class="badge bg-success"><i class="bi bi-check-all me-1"></i>Feltöltve</span>',
      'duplicate': '<span class="badge bg-warning"><i class="bi bi-exclamation-triangle me-1"></i>Már létezik</span>',
      'error': '<span class="badge bg-danger"><i class="bi bi-x-circle me-1"></i>Hiba</span>',
    }[bf.status] || '<span class="badge bg-secondary">' + bf.status + '</span>';
    
    // Metaadat mezők (csak ha már kinyerve)
    let metaFields = '';
    if (bf.status === 'extracted' || bf.status === 'ready' || bf.status === 'searching') {
      metaFields = `
        <div class="row g-1 mt-1">
          <div class="col-5">
            <input type="text" class="form-control form-control-sm" placeholder="Cím" 
                   value="${escHtml(bf.metadata.title || '')}" 
                   onchange="batchFiles[${i}].metadata.title = this.value; updateButtons();">
          </div>
          <div class="col-4">
            <input type="text" class="form-control form-control-sm" placeholder="Szerző"
                   value="${escHtml(bf.metadata.author || '')}"
                   onchange="batchFiles[${i}].metadata.author = this.value; updateButtons();">
          </div>
          <div class="col-2">
            <select class="form-select form-select-sm" onchange="batchFiles[${i}].metadata.language = this.value;">
              <option value="en" ${bf.metadata.language === 'en' ? 'selected' : ''}>EN</option>
              <option value="hu" ${bf.metadata.language === 'hu' ? 'selected' : ''}>HU</option>
              <option value="de" ${bf.metadata.language === 'de' ? 'selected' : ''}>DE</option>
              <option value="fr" ${bf.metadata.language === 'fr' ? 'selected' : ''}>FR</option>
              <option value="es" ${bf.metadata.language === 'es' ? 'selected' : ''}>ES</option>
            </select>
          </div>
          <div class="col-1">
            <button class="btn btn-sm btn-outline-info" onclick="fetchMetadataForBook(${i})" title="Keresés az interneten">
              <i class="bi bi-search"></i>
            </button>
          </div>
        </div>`;
    }
    
    // Hibaüzenet
    let errorMsg = '';
    if (bf.error) errorMsg = `<small class="text-danger">${escHtml(bf.error)}</small>`;
    if (bf.metadata && bf.metadata._extractError) errorMsg += `<small class="text-warning d-block">${escHtml(bf.metadata._extractError)}</small>`;
    
    // Duplikátum info
    let dupInfo = '';
    if (bf.status === 'duplicate' && bf.duplicateInfo) {
      dupInfo = `<small class="text-warning d-block">Feltöltő: ${bf.duplicateInfo.uploader_name || 'ismeretlen'}</small>`;
    }
    
    html += `
    <div class="col-md-6 col-lg-4">
      <div class="card bg-dark border-secondary h-100" style="border-left:3px solid ${bf.status === 'done' ? 'var(--accent-green)' : bf.status === 'error' ? '#dc3545' : bf.status === 'duplicate' ? '#ffc107' : '#666'};">
        <div class="card-body py-2">
          <div class="d-flex justify-content-between align-items-start">
            <div class="flex-grow-1" style="min-width:0;">
              <small class="text-truncate d-block fw-bold" title="${escHtml(bf.file.name)}">${escHtml(bf.file.name)}</small>
              ${dupInfo}
              ${errorMsg}
            </div>
            <div class="flex-shrink-0 ms-2">${statusBadge}</div>
          </div>
          ${metaFields}
        </div>
      </div>
    </div>`;
  });
  
  document.getElementById('batchBookList').innerHTML = html;
}

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============================
// KÖNYVTÁR LISTA (meglévő kód)
// ============================
async function loadBooks() {
  const resp = await fetch('/api/library/list', {credentials:'same-origin'});
  const data = await resp.json();
  allBooks = data.books || [];
  document.getElementById('bookCount').textContent = allBooks.length;
  renderBooks();
}

function renderBooks() {
  const ft = document.getElementById('filterTitle').value.toLowerCase();
  const fa = document.getElementById('filterAuthor').value.toLowerCase();
  const fg = document.getElementById('filterGenre').value;
  const fl = document.getElementById('filterLanguage').value;
  const filtered = allBooks.filter(b => {
    return (!ft || (b.title||'').toLowerCase().includes(ft)) &&
           (!fa || (b.author||'').toLowerCase().includes(fa)) &&
           (!fg || b.genre === fg) &&
           (!fl || b.language === fl);
  });
  let html = '';
  if (filtered.length === 0) {
    html = '<p class="text-muted text-center py-4"><i class="bi bi-inbox" style="font-size:2rem;"></i><br>Nincsenek könyvek. Húzz ide EPUB fájlokat a feltöltéshez!</p>';
  } else {
    html = '<div class="table-responsive"><table class="table table-dark table-striped table-sm"><thead><tr><th>Cím</th><th>Szerző</th><th>Nyelv</th><th>Műfaj</th><th>Sorozat</th><th>Feltöltő</th><th>Kontextus</th><th>Művelet</th></tr></thead><tbody>';
    filtered.forEach(b => {
      const seriesStr = b.series ? (b.series + (b.series_number ? ' #'+b.series_number : '')) : '-';
      const selectedBtn = b.is_selected 
        ? `<button class="btn btn-sm btn-success" onclick="toggleBook(${b.id})" title="Kiválasztva fordításhoz">⭐</button>`
        : `<button class="btn btn-sm btn-outline-secondary" onclick="toggleBook(${b.id})" title="Kiválasztás fordításhoz">☆</button>`;
      let actionBtns = '';
      if (b.is_owner) {
        actionBtns = `<button class="btn btn-sm btn-outline-warning me-1" onclick="editBook(${b.id})" title="Szerkesztés"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger" onclick="deleteBook(${b.id})" title="Törlés"><i class="bi bi-trash"></i></button>`;
      }
      html += `<tr>
        <td class="text-truncate" style="max-width:200px;" title="${escHtml(b.title || '')}">${escHtml(b.title || '-')}</td>
        <td>${escHtml(b.author || '-')}</td>
        <td><span class="badge bg-secondary">${escHtml(b.language || '-')}</span></td>
        <td>${escHtml(b.genre || '-')}</td>
        <td>${escHtml(seriesStr)}</td>
        <td><small>${escHtml(b.uploader_name || '-')}</small></td>
        <td>${selectedBtn}</td>
        <td>${actionBtns || '<small class="text-muted">-</small>'}</td>
      </tr>`;
    });
    html += '</tbody></table></div>';
  }
  document.getElementById('booksTable').innerHTML = html;
}

async function editBook(id) {
  const b = allBooks.find(x => x.id === id);
  if (!b || !b.is_owner) { alert('Nincs jogosultságod szerkeszteni ezt a könyvet!'); return; }
  const title = prompt('Cím:', b.title || '');
  if (title === null) return;
  const author = prompt('Szerző:', b.author || '');
  if (author === null) return;
  const genre = prompt('Műfaj:', b.genre || '');
  if (genre === null) return;
  const series = prompt('Sorozat:', b.series || '');
  if (series === null) return;
  const sn = prompt('Sorozat száma:', b.series_number || '');
  if (sn === null) return;
  const lang = prompt('Nyelv (en/hu/de/fr/es):', b.language || 'en');
  if (lang === null) return;
  const fd = new FormData();
  fd.append('title', title); fd.append('author', author); fd.append('genre', genre);
  fd.append('series', series); fd.append('series_number', sn); fd.append('language', lang);
  const resp = await fetch('/api/library/edit/'+id, {method:'POST', credentials:'same-origin', body:fd});
  const data = await resp.json();
  if (data.error) { alert(data.error); } else { loadBooks(); }
}

async function deleteBook(id) {
  const b = allBooks.find(x => x.id === id);
  if (!b || !b.is_owner) { alert('Nincs jogosultságod törölni ezt a könyvet!'); return; }
  if (!confirm('Biztosan törlöd ezt a könyvet? A művelet nem vonható vissza.')) return;
  const resp = await fetch('/api/library/delete/'+id, {method:'POST', credentials:'same-origin'});
  const data = await resp.json();
  if (data.error) { alert(data.error); } else { loadBooks(); }
}

async function toggleBook(id) {
  const resp = await fetch('/api/library/toggle/'+id, {method:'POST', credentials:'same-origin'});
  const data = await resp.json();
  if (data.error) { alert(data.error); } else { loadBooks(); }
}

window.addEventListener('load', () => loadBooks());
</script>
{% endblock %}
