name: Build Desktop (Windows + macOS)

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Frontend build (a React SPA -> src/frontend/dist)
      - name: Build frontend
        working-directory: src/frontend
        run: |
          npm ci
          npm run build

      # SPA másolása a desktop mappába (electron-builder csak belső utat tud)
      - name: Copy frontend dist into desktop
        shell: bash
        run: |
          mkdir -p desktop/frontend-dist
          cp -r src/frontend/dist/* desktop/frontend-dist/

      # Backend -> PyInstaller (a Flask app becsomagolása kulcsfontosságú)
      - name: Build backend with PyInstaller
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pyinstaller
          pyinstaller --onefile --name backend --paths . --hidden-import app --hidden-import config --hidden-import models --distpath ../../desktop/pybackend --workpath ../../desktop/pybuild --specpath ../../desktop/pybuild ../../desktop/backend_entry.py

      # Electron telepítő (desktop-nak nincs lockfile -> npm install)
      - name: Build Electron installer
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --${{ matrix.os == 'windows-latest' && 'win' || 'mac' }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: desktop/dist/*
          if-no-files-found: ignore