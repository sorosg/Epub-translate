name: Build Desktop (Windows + macOS)

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Frontend build (a React SPA -> frontend/dist)
      - name: Build frontend
        working-directory: src/frontend
        run: |
          npm ci
          npm run build

      # Backend -> PyInstaller futtatható (backend_entry.py)
      # A desktop buildhez a szerver-függőségek nélküli requirements-desktop.txt-t
      # használjuk (nincs psycopg2/gunicorn/redis -> kisebb, stabilabb bináris).
      - name: Install backend deps (desktop)
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pyinstaller
          pyinstaller --onefile --name backend ../../desktop/backend_entry.py

      # Electron telepítő
      - name: Build Electron installer
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --${{ matrix.os == 'windows-latest' && 'win' || 'mac' }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: desktop/dist/*.exe
          if-no-files-found: ignore
